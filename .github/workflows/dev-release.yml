name: Dev Release — Build & Tag

on:
  push:
    branches: [development]

concurrency:
  group: dev-release
  cancel-in-progress: true

jobs:
  dev-release:
    name: Build Dev AppImage & Create Dev Tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-cursor0 libegl1 libgl1 \
            libfuse2 wget patchelf desktop-file-utils \
            libglib2.0-dev qt6-base-dev
          pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Generate dev version
        id: version
        run: |
          BASE=$(python3 -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          TIMESTAMP=$(date -u '+%Y%m%d.%H%M%S')
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="${BASE}-dev.${TIMESTAMP}.${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Generated dev version: v${VERSION}"

      - name: Build AppImage
        run: |
          chmod +x packaging/build-appimage.sh
          VERSION="${{ steps.version.outputs.version }}" \
            bash packaging/build-appimage.sh

      - name: Create dev git tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.email "vitormoreiradesenvolvedor@gmail.com"
          git config user.name "Vitor Moreira"
          git tag -a "$TAG" -m "Dev release: $TAG"
          git push origin "$TAG"

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Dev Build — ${{ steps.version.outputs.version }}"
          prerelease: true
          body: |
            ## Build de desenvolvimento — FluxDrive

            **Versão:** `${{ steps.version.outputs.version }}`
            **Branch:** `development`
            **Commit:** `${{ github.sha }}`
            **Data:** ${{ github.event.head_commit.timestamp }}

            > Esta é uma build de desenvolvimento para testes locais.
            > Não use em produção.

            ### Mudanças
            ${{ github.event.head_commit.message }}
          files: |
            dist/FluxDrive-*.AppImage
            dist/FluxDrive-*.AppImage.sha256
            dist/FluxDrive-*.sh
